[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phxpict"
version = "0.1.0"
description = "Privacy-first desktop photo indexing and search by MacroStofft"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{name = "MacroStofft"}]
dependencies = ["Pillow>=12.3", "pillow-heif>=1.7"]

[project.optional-dependencies]
visual = [
    "torch>=2.14,<3",
    "transformers>=5.17,<6",
]
test = []
dev = [
    "PyInstaller>=6.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
phxpict = "phxpict.app:main"
phxpict-cli = "phxpict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true
