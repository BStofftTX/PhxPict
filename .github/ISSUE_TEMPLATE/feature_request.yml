name: Feature request
description: Propose a focused PhxPict improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should the change be tested across supported platforms?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and resource considerations
      description: Note local-data, model, network, CPU, memory, or storage implications.
